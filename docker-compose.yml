# Secrets live outside git:
#   ./.env        – Mongo root credentials used below (see .env.example)
#   ./server/.env – backend app secrets (see server/.env.example)
# Both are read on the server only; never commit or upload them from a dev machine.
services:
  frontend:
    build:
      context: ./
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - scient-network

  backend:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@db:27017/scient?authSource=admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - scient-network

  db:
    image: mongo:8.0.1
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - scient-network

  # Optional DB admin UI, not exposed publicly. Start it with
  #   docker compose --profile tools up -d db-client
  # and reach it through an SSH tunnel: ssh -L 8081:127.0.0.1:8081 user@server
  db-client:
    image: mongo-express:1.0.2-20-alpine3.19
    profiles: ["tools"]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@db:27017/scient?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_BASICAUTH_PASSWORD:?set ME_BASICAUTH_PASSWORD in .env}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - db
    networks:
      - scient-network

networks:
  scient-network:
    external: true

volumes:
  db-data:
